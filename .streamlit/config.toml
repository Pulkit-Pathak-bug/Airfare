# Pin the dashboard's appearance.
#
# Without this, Streamlit follows the viewer's OS/browser theme, so the
# same app looks different on every laptop it is demonstrated from — dark
# page with light chart panels on one machine, all-light on another.
# For a judged demo that has to be deterministic.
#
# Light is chosen deliberately: every chart in dashboard/app.py is styled
# for a light surface (see SURFACE / INK / SEQ_BLUE in that file), and the
# sequential blue ramp runs light-to-dark for magnitude, which inverts
# unreadably on a dark ground. Switching the app to dark means restyling
# and revalidating every chart, not flipping a flag.

[theme]
base = "light"
primaryColor = "#2a78d6"          # matches the categorical series colour
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f5f7"
textColor = "#0b0b0b"

[browser]
gatherUsageStats = false

[server]
headless = true
